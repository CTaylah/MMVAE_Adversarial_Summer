class_path: cmmvae.models.CMMVAEModel
init_args:
  kl_annealing_fn:
    class_path: cmmvae.modules.base.KLAnnealingFn
    init_args:
      kl_weight: 1.0
  record_gradients: false
  adv_weight: 40
  adversarial_method: ""
  gradient_record_cap: 20
  autograd_config:
    # class_path: cmmvae.config.AutogradConfig
    # init_args:
    #   adversarial_gradient_clip:
    #     class_path: cmmvae.config.GradientClipConfig
    #     init_args:
    #       val: 1
    #       algorithm: norm
    #   vae_gradient_clip:
    #     class_path: cmmvae.config.GradientClipConfig
    #     init_args:
    #       val: 1
    #       algorithm: norm
    #   expert_gradient_clip:
    #     class_path: cmmvae.config.GradientClipConfig
    #     init_args:
    #       val: 1
    #       algorithm: norm
  module:
    class_path: cmmvae.modules.CMMVAE
    init_args:
      vae:
        class_path: cmmvae.modules.CLVAE
        init_args:
          latent_dim: 128
          # conditionals:
          # - assay
          # - donor_id
          # - dataset_id
          # - species
          encoder_config:
            class_path: cmmvae.modules.base.FCBlockConfig
            init_args:
              layers: [512, 256, 256]
              dropout_rate: 0.0
              use_batch_norm: True
              use_layer_norm: False
              activation_fn: torch.nn.ReLU
              return_hidden:
              - True
              - True
          decoder_config:
            class_path: cmmvae.modules.base.FCBlockConfig
            init_args:
              layers: [ 128, 256, 512]
              dropout_rate: 0.0
              use_batch_norm: True
              use_layer_norm: False
              activation_fn: torch.nn.ReLU
          conditional_config:
            class_path: cmmvae.modules.base.FCBlockConfig
            init_args:
              layers:
              - 128
              dropout_rate: 0.0
              use_batch_norm: True
              use_layer_norm: False
              activation_fn: null
      experts:
        class_path: cmmvae.modules.base.Experts
        init_args:
          experts:
          - class_path: cmmvae.modules.base.Expert
            init_args:
              id: human
              encoder_config:
                class_path: cmmvae.modules.base.FCBlockConfig
                init_args:
                  layers: [ 60530, 1024, 512]
                  dropout_rate: [ 0.1, 0.1 ]
                  use_batch_norm: True
                  use_layer_norm: False
                  activation_fn: torch.nn.ReLU
              decoder_config:
                class_path: cmmvae.modules.base.FCBlockConfig
                init_args:
                  layers: [ 512, 1024, 60530 ]
                  dropout_rate: 0.0
                  use_batch_norm: True
                  use_layer_norm: False
                  activation_fn: torch.nn.ReLU
          - class_path: cmmvae.modules.base.Expert
            init_args:
              id: mouse
              encoder_config:
                class_path: cmmvae.modules.base.FCBlockConfig
                init_args:
                  layers: [ 52437, 1024, 512]
                  dropout_rate: [ 0.1, 0.1 ]
                  use_batch_norm: True
                  use_layer_norm: False
                  activation_fn: torch.nn.ReLU
              decoder_config:
                class_path: cmmvae.modules.base.FCBlockConfig
                init_args:
                  layers: [ 512, 1024, 52437 ]
                  dropout_rate: 0.0
                  use_batch_norm: True
                  use_layer_norm: False
                  activation_fn: torch.nn.ReLU
      adversarial_groups:
        - class_path: cmmvae.modules.base.AdversarialsGroup
          init_args:
            conditional: species
            adversarials:
            - class_path: cmmvae.modules.base.FCBlockConfig
              init_args:
                layers: [ 256, 16, 2 ]
                dropout_rate: 0.0
                use_batch_norm: 
                - True
                - False
                use_layer_norm: False
                activation_fn: 
                - torch.nn.ReLU
                - torch.nn.Softmax
            - class_path: cmmvae.modules.base.FCBlockConfig
              init_args:
                layers: [ 256, 16, 2 ]
                dropout_rate: 0.0
                use_batch_norm: 
                - True
                - False
                use_layer_norm: False
                activation_fn: 
                - torch.nn.ReLU
                - torch.nn.Softmax
