class_path: cmmvae.models.CMMVAEModel
init_args:
  module:
    class_path: cmmvae.modules.CMMVAE
    init_args:
      vae:
        class_path: cmmvae.modules.CLVAE
        init_args:
          encoder_config:
            class_path: cmmvae.modules.base.FCBlockConfig
            init_args:
              layers:
              - 512
              - 80
              dropout_rate: 0.0
              use_batch_norm: false
              use_layer_norm: true
              return_hidden:
              - false
              activation_fn: torch.nn.ReLU
          decoder_config:
            class_path: cmmvae.modules.base.FCBlockConfig
            init_args:
              layers:
              - 40
              - 120
              - 512
              dropout_rate: 0.0
              use_batch_norm: false
              use_layer_norm: true
              return_hidden: false
              activation_fn: torch.nn.ReLU
          conditional_config:
            class_path: cmmvae.modules.base.FCBlockConfig
            init_args:
              layers:
              - 40
              dropout_rate: 0.0
              use_batch_norm: false
              use_layer_norm: true
              return_hidden: false
              activation_fn: null
          conditionals:
          - assay
          - donor_id
          - tissue
          - species
          selection_order:
          - parallel
          concat_config:
            class_path: cmmvae.modules.base.ConcatBlockConfig
            init_args:
              dropout_rate: 0.0
              use_batch_norm: false
              use_layer_norm: true
              return_hidden: false
              activation_fn: torch.nn.ReLU
          latent_dim: 40
          distribution: normal
          var_eps: 0.0001
      experts:
        class_path: cmmvae.modules.base.Experts
        init_args:
          experts:
          - class_path: cmmvae.modules.base.Expert
            init_args:
              id: human
              encoder_config:
                class_path: cmmvae.modules.base.FCBlockConfig
                init_args:
                  layers:
                  - 60530
                  - 1024
                  - 512
                  dropout_rate:
                  - 0.1
                  - 0.0
                  use_batch_norm: false
                  use_layer_norm: true
                  return_hidden: false
                  activation_fn: torch.nn.ReLU
              decoder_config:
                class_path: cmmvae.modules.base.FCBlockConfig
                init_args:
                  layers:
                  - 512
                  - 1024
                  - 60530
                  dropout_rate: 0.0
                  use_batch_norm: false
                  use_layer_norm: true
                  return_hidden: false
                  activation_fn: torch.nn.ReLU
          - class_path: cmmvae.modules.base.Expert
            init_args:
              id: mouse
              encoder_config:
                class_path: cmmvae.modules.base.FCBlockConfig
                init_args:
                  layers:
                  - 52437
                  - 1024
                  - 512
                  dropout_rate:
                  - 0.1
                  - 0.0
                  use_batch_norm: false
                  use_layer_norm: true
                  return_hidden: false
                  activation_fn: torch.nn.ReLU
              decoder_config:
                class_path: cmmvae.modules.base.FCBlockConfig
                init_args:
                  layers:
                  - 512
                  - 1024
                  - 52437
                  dropout_rate: 0.0
                  use_batch_norm: false
                  use_layer_norm: true
                  return_hidden: false
                  activation_fn: torch.nn.ReLU
      adversarial_groups:
      - class_path: cmmvae.modules.base.AdversarialsGroup
        init_args:
          adversarials:
          - class_path: cmmvae.modules.base.FCBlockConfig
            init_args:
              layers:
              - 40
              - 32
              - 2
              dropout_rate: 0.0
              use_batch_norm: false
              use_layer_norm:
              - true
              - false
              return_hidden: false
              activation_fn:
              - torch.nn.ReLU
              - null
          conditional: species
      - class_path: cmmvae.modules.base.AdversarialsGroup
        init_args:
          adversarials:
          - class_path: cmmvae.modules.base.FCBlockConfig
            init_args:
              layers:
              - 40
              - 32
              - 26
              dropout_rate: 0.0
              use_batch_norm: false
              use_layer_norm:
              - true
              - false
              return_hidden: false
              activation_fn:
              - torch.nn.ReLU
              - null
          conditional: assay
  adv_weight: 100
  adversarial_method: GRF
  autograd_config:
    class_path: cmmvae.config.AutogradConfig
    init_args:
      adversarial_gradient_clip:
        class_path: cmmvae.config.GradientClipConfig
        init_args:
          val: 10
          algorithm: norm
      vae_gradient_clip:
        class_path: cmmvae.config.GradientClipConfig
        init_args:
          val: 10
          algorithm: norm
      expert_gradient_clip:
        class_path: cmmvae.config.GradientClipConfig
        init_args:
          val: 10
          algorithm: norm
  record_gradients: false
  save_gradients_interval: 25
  gradient_record_cap: 20
  kl_annealing_fn:
    class_path: cmmvae.modules.base.LinearKLAnnealingFn
    init_args:
      min_kl_weight: 0.1
      max_kl_weight: 2.0
      warmup_steps: 1000.0
      climax_steps: 6000.0
  predict_dir: ''
  predict_save_interval: 600
  initial_save_index: -1
  use_he_init_weights: true